<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Otros Esfuerzos | CED CORFO</title>
  <style>
    :root {
      --brand: #221e7c;
      --text: #252a43;
      --muted: #59627a;
      --line: #d9deea;
      --surface: #ffffff;
      --page: #f4f6f8;
      --accent: #f19320;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(860px, calc(100% - 40px));
      margin: 0 auto;
      padding: 80px 0;
    }

    h1 {
      margin: 0 0 18px;
      text-align: center;
      color: var(--brand);
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .lead {
      max-width: 62ch;
      margin: 0 auto 32px;
      text-align: center;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    /* Enlaces como tabla de referencias */
    .links { border-top: 1.5px solid var(--brand); width: min(840px, 100%); margin: 0 auto; }

    .links-head,
    .link {
      display: grid;
      grid-template-columns: 500px minmax(200px, 1fr);
      align-items: center;
      gap: 0;
    }

    .links-head {
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .links-head span {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(34, 30, 124, 0.5);
    }

    .link {
      position: relative;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
      transition: background 160ms ease;
    }

    .link:hover,
    .link:focus-visible { background: rgba(34, 30, 124, 0.035); outline: none; }

    .link::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--accent);
      transform: scaleY(0);
      transition: transform 180ms ease;
    }

    .link:hover::before,
    .link:focus-visible::before { transform: scaleY(1); }

    .name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--brand);
      line-height: 1.3;
    }

    .desc {
      display: block;
      margin-top: 3px;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.45;
    }

    .links-head span,
    .link > div { padding-left: 28px; }
    .links-head span:first-child,
    .link > div:first-child { padding-left: 0; }
    .links-head span:nth-child(2),
    .link > div:nth-child(2) { border-left: 1px solid var(--line); margin-left: 28px; align-self: stretch; display: flex; align-items: center; }

    .url {
      font-size: 0.78rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cta {
      display: none;
    }

    .link:hover .cta,
    .link:focus-visible .cta { background: var(--brand); color: #fff; }

    @media (max-width: 760px) {
      .links-head { display: none; }
      .link { grid-template-columns: 1fr; gap: 8px; padding: 18px 0; }
      .link > div { padding-left: 0; }
      .link > div:nth-child(2) { border-left: none; margin-left: 0; }
      .cta { justify-self: start; }
    }

    @media (max-width: 560px) {
      main {
        width: min(100% - 28px, 480px);
        padding: 48px 0;
      }

      .lead { font-size: 0.98rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="oeTitle">Otros Esfuerzos</h1>
    <p class="lead" data-i18n="oeLead">
      Este trabajo se enmarca en un esfuerzo mundial por construir y medir cuentas económicas desagregadas. Entre otras iniciativas, puedes conocer:
    </p>

    <nav class="links" aria-label="Iniciativas relacionadas">
      <div class="links-head"><span data-i18n="oeColInitiative">Iniciativa</span><span data-i18n="oeColSource">Fuente</span></div>
      <a class="link" href="https://www.disaggregatedaccounts.com/" target="_blank" rel="noopener" data-oe="denmark">
        <div><span class="name">Cuentas Económicas Desagregadas de Dinamarca</span></div>
        <div class="url">disaggregatedaccounts.com</div>
      </a>
      <a class="link" href="https://www.oecd.org/en/data/datasets/inter-country-input-output-tables.html" target="_blank" rel="noopener">
        <div><span class="name" data-i18n="oeItem2Name">Tablas de Insumo-Producto Interpaíses</span></div>
        <div class="url">oecd.org</div>
      </a>
    </nav>
  </main>
</body>
</html>
